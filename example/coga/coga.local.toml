# Local per-machine config. `coga.local.toml` is gitignored in a real repo;
# this copy ships with the example so the smoke test has something to read.

user = "marc"

# Secrets are declared inline on each ticket's `secrets:` frontmatter
# (`NAME: op://vault/item/field` or `NAME: env:VAR`) — there is no central
# [secrets] catalog.

# Per-agent permission-skip keys from older installs are removed; current
# launch rejects them as unknown config.

# Agent tables layer over coga.toml at the key level. This machine selects an
# explicit peer for each locally relevant author and adds a third, local-only
# agent type without changing the shared default-agent declaration order.
[agents.claude]
peer = "codex"

[agents.local-llm]
cli = "ollama"
file = "AGENTS.md"
peer = "codex"
