version = 1

# Default status for new tasks. Tickets stay `draft` until approved —
# `coga launch` activates a draft inline, or `coga mark active` activates
# it without launching.
default_status = "draft"

# Optional: the agent type new tickets get when activated (and the fallback
# for retire, autofix, and authoring). Unset, it's the first [agents.*]
# table below. Set it in coga.local.toml to override it on one machine only
# (local wins); either value must name a configured type or config load fails.
# Activation writes it into the ticket's `agent:`, so changing it affects only
# tickets activated afterwards. It does not move `coga chat` or `coga ticket`:
# their packaged tickets pin `agent: claude`, so use `--agent` or
# `[authoring] agent` in coga.local.toml for those.
# default_agent = "claude"

# Optional: the one operator who may run recurring sweeps in this repo.
# Committed, so every clone agrees on it — with it set, `coga recurring`
# (including `--force`) and `coga recurring launch` refuse to run for anyone
# whose `user` in coga.local.toml differs, which keeps two machines from
# sweeping the same repo at once. Left unset, recurring is ungated.
# owner = "marc"

# --- Agents ---
# Agent types. Each defines the CLI binary and how to invoke it; a ticket's
# `agent:` names one of these tables, and an undefined name fails loud.
#
#   cli          (required) executable to spawn; launch fails before writing
#                any state when it is not on PATH.
#   file         (required) the instruction file this CLI reads at the repo
#                root (CLAUDE.md, AGENTS.md).
#   mode         "local", the default and only mode.
#   launch_args  extra argv tokens (one string, shell-split) placed right
#                after `cli` in every interactive spawn: launch, megalaunch,
#                `coga ticket` and `coga chat`. Not used by `analyze`.
#   peer         the reviewer type an `other-agent` workflow step selects;
#                see the commented example under [agents.claude].
#
# The other keys are explained beside their values below.
#
# These tables may also appear in coga.local.toml. A local table overrides
# the shared one key by key (say, a different `cli` path) and inherits the
# rest; a local-only table adds a type installed only on that machine. An
# explicit local `launch_args = ""` clears a shared value.
#
# Removed headless-agent keys (`auto`, `skip_permissions`,
# `skip_permissions_argv`) fail config load with a migration
# error — delete those lines if upgrading from coga 0.2.0.

[agents.claude]
cli = "claude"
file = "CLAUDE.md"
mode = "local"
# `claude -n <name>` sets the session display name shown in the /resume
# picker, the prompt box, and the terminal title. Skipped in discussion
# launches so the human's first ask names the session.
name_flag = "-n"
# `claude --session-id <uuid>` lets Coga deterministically recover the
# transcript usage for exactly the session it launched.
session_id_flag = "--session-id"
# `discussion` rides the composed prompt as system context for discussion
# sessions (`coga chat`, `coga ticket`) so the human's first ask becomes
# the session title instead of a 20KB Coga prompt.
discussion = "--append-system-prompt {prompt}"
# `analyze` is the one-shot, non-interactive argv the recurring sweep's autofix
# loop uses to have this CLI read a finished run (text in, text out — no REPL).
# `claude` and `codex` have working built-in defaults, so this line only needs
# writing for another CLI; without one, the loop skips loudly.
# analyze = "-p {prompt}"
# `peer` picks the reviewer for `other-agent` steps when this type is the
# ticket's main agent. It must name another configured type, and it is
# one-directional: it says nothing about who reviews codex's tickets. Unset,
# "other" is the one configured type that is not the main agent, which needs
# no setting with exactly two types; with three or more, set it or the
# handoff fails asking for it. It is read from live config at each handoff, so
# a `peer` in coga.local.toml changes the reviewer on that machine only.
# peer = "codex"

[agents.codex]
cli = "codex"
file = "AGENTS.md"
mode = "local"
discussion = "-c developer_instructions={prompt}"
# Codex's shared app-server daemon runs shell commands with its own env, so
# the `COGA_*` launch variables never reach the agent (bumps get credited to
# a human, the stale-step guard is skipped, and the done sentinel never fires,
# leaving the session open after its bump); `--no-daemon` runs the app server
# in-process and keeps them. Disabling `daemon_auto_start` is not enough while
# a daemon already runs. When this happens, launch prints a warning after the
# session that the ticket moved without a done signal. Repos created before
# this line shipped should add it, here or per machine in coga.local.toml.
# Remove it only if your Codex predates the flag.
launch_args = "--no-daemon"

# --- Unattended runs ---
# Optional, shared only (coga.local.toml rejects these tables).
#
# Recurring sweeps skip scheduled jobs once no human has committed for
# `idle_days` days (default 14); `0` disables the gate. `--force` and named
# launches bypass it.
#   [recurring]
#   idle_days = 14
#
# Liveness limits, in seconds, for agent sessions the recurring sweep starts
# unattended; attended `coga launch` never reads them. `idle_timeout`
# (default 900) ends a session with no terminal activity for that long; `max_session`
# (default unlimited) caps its wall clock. `0` disarms either.
# COGA_REPL_IDLE_TIMEOUT / COGA_REPL_MAX_SESSION override them per run.
#   [launch]
#   idle_timeout = 900
#   max_session = 7200
#
# The agent type that analyzes a finished sweep and files fix tickets
# (autofix). Unset, it's `default_agent`; `--agent` overrides it per run.
# It must name a configured type; a type some clone declares only in its
# coga.local.toml breaks the other clones.
#   [autofix]
#   agent = "codex"

# --- Notification channels ---
# Coga's notification system is the team sync point. It is optional on first
# run: a fresh repo ships with no channels selected, so a brand-new user can
# run draft/mark/launch/bump without configuring anything. Turn it on when you
# start coordinating with other people.
#
# Slack is the first channel: urgent/manual events and ticket outcomes (done,
# canceled, recurring errors) post live through the Slack webhook as they
# happen. Relaunching an already-in-progress ticket does not post. Once Slack
# is selected it is fail-loud — a missing/revoked/unreachable
# webhook crashes the command rather than dropping the message silently.
#
# To opt in, select the channel and point it at a webhook. Use `env:`
# indirection so the URL (a bearer token) stays out of this committed file —
# export SLACK_WEBHOOK_URL locally and coga resolves it:
#
#   [notification]
#   channels = ["slack"]
#
#   [notification.slack]
#   webhook = "env:SLACK_WEBHOOK_URL"
#
# A machine-specific webhook can override this in coga.local.toml (local wins),
# e.g. a literal URL there for a personal channel. Never commit a real URL.
# `coga validate --check-slack` probes the webhook so dead URLs surface
# at config time, not at first bump. A bare SLACK_WEBHOOK_URL export fails config
# load; the explicit `webhook` key above is required.
#
# Already opted in but want Slack temporarily silent (solo runs, dev/test, CI
# without notifications)? Keep the channel selected and set in coga.local.toml:
#   [notification.slack]
#   enabled = false
[notification]
channels = []

# Optional Slack extras, active once you opt in above:
#
# Route alerts to a second channel. Posts that need a human to go do something
# go to `important_webhook`; ordinary state transitions stay on `webhook`.
# This includes `coga slack --important` and automatic recurring-job failures,
# so this key becomes required once recurring jobs run with Slack enabled.
# `coga validate` warns when that enabled destination is unresolved. An
# important post still crashes rather than rerouting to `webhook`, since a
# human-action alert in the wrong channel is worse than a crash that gets the
# config fixed. Same `env:` indirection, same reason:
#   [notification.slack]
#   important_webhook = "env:COGA_IMPORTANT_WEBHOOK_URL"
#
# Attach a GIF to milestone events. One URL is picked at random
# per post. Skip a kind (or leave its list empty) to keep that event
# text-only. Example:
#   [notification.slack.gifs]
#   done  = ["https://media.giphy.com/media/<id>/giphy.gif"]
#   block = [
#     "https://media.giphy.com/media/<id-a>/giphy.gif",
#     "https://media.giphy.com/media/<id-b>/giphy.gif",
#   ]
#
# Optional: map a coga name (the token used in a ticket's `owner` field) to a
# Slack member ID. With a mapping, that person gets a real `<@…>` ping on posts
# about their ticket. Without one they're still named, just in plain text (no
# ping). An incoming webhook can't look an ID up itself, so it has to be
# listed here. Grab an ID from Slack: profile → ⋮ (More) → Copy member ID.
#   [notification.slack.users]
#   marc = "U01ABC234"
#   ada  = "U05XYZ789"

# --- Git sync ---
# The git analogue of Slack: every command that mutates ticket state commits
# the resolved task directory under `coga/tasks/` and pushes it to the
# control branch, so the git-backed repo never drifts from the team's live state.
# Always-on — these defaults apply even with no `[git]` table.
#
# When HEAD is the control branch the task files are committed and pushed; on
# a feature branch (or detached HEAD) the same files are landed on the control
# branch via a working-tree-free plumbing path. A failed commit/push is
# non-fatal: it is surfaced to stderr + the task's log.md, but never aborts the
# local state transition (the on-disk markdown is the source of truth; git is
# only the sync layer, so a push that can't reach a protected/remote control
# branch must not block a `bump` / `mark` / launch).
#
# Defaults: enabled = true, remote = "origin", control_branch = "main".
# To opt out (a repo with no remote: dev/test, CI, solo branches), set
# `enabled = false` here or in coga.local.toml (local overrides shared,
# like [notification.slack]):
#   [git]
#   enabled = false
#
# `worktrees_ticket_owned` (default false, shared only) declares that every
# linked worktree of this git repository belongs to a Coga ticket, so the
# weekly branch sweep may remove a landed, locally pristine worktree that no
# live ticket records before deleting its branch. Off, such a worktree keeps
# pinning its branch (`skipped-worktree-pinned`). The
# `coga/checkout-cleanup/branch-sweep` context states the assumption; set it only once everyone on the repo works
# that way.
#   [git]
#   worktrees_ticket_owned = true

# --- Aliases ---
# Thin sugar for often-used commands. Each entry maps a name to an
# expanded coga command (free-form string). Positional args after the
# alias name are forwarded to the expansion. Alias names cannot collide
# with built-in commands.

[aliases]
chat = "launch bootstrap/orient"
# `build` is first-run onboarding — it launches the packaged `coga-build`
# ticket (one question → agent-led chat → vision → starter tickets). Requires
# an already-init'd repo; `coga init` captures your name beforehand.
build = "launch coga-build"
# `pick` opens the interactive megalaunch picker — a memorable name for
# `coga megalaunch --pick`. A trailing directory still scopes it
# (`coga pick marketing`).
pick = "megalaunch --pick"
# `dream` creates the `recurring/dream/` cleanup task and launches it now —
# the same path `coga recurring launch dream` takes.
dream = "recurring launch dream"
# Uncomment to add per-agent shortcuts. The --agent value must match an
# `[agents.*]` block above.
# claude = "launch bootstrap/orient --agent claude"
# codex = "launch bootstrap/orient --agent codex"

# --- Extensions ---
# A repo-owned, free-form namespace coga does not interpret. Put repo-specific
# config your own skills/scripts read here — anything that isn't part of coga's
# fixed schema. coga accepts it verbatim (like [aliases]) and never
# validates the keys, so nested tables and arbitrary values are fine. Read it
# via `load_config().extensions["<ns>"]` or by parsing coga.toml directly.
# [extensions.patent]
# calendar_id = "<your-google-calendar-id>"

# Weekly aggregate counts/movement and bounded version/platform fields go to
# FastJVM's US PostHog project shared with Multiply, under an opaque repo UUID.
# Only operator sweeps report (Monday 07:00); this is not an install count.
# Download/init send nothing. No task content; the peer sees source IP, which
# project settings discard, with GeoIP disabled. Source/editable builds do not send.
# Opt out here or locally. Disabling stops sending; movement from the gap may
# appear in the first count after re-enabling. See recurring/phone-home/ticket.md
# for the contract and recurring/phone-home/operations.md for maintenance.
[telemetry]
enabled = true
